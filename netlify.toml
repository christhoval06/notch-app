[build]
  publish = "build/web"
  command = "git clone https://github.com/flutter/flutter.git -b stable --depth 1 _flutter && export PATH=\"$PATH:$(pwd)/_flutter/bin\" && flutter doctor && flutter build web --release -t lib/main_landing.dart"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
